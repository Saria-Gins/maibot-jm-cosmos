[plugin]
enabled = true
config_version = "1.1.3"

[download]
base_dir = "data/plugins/gemiluxvii.jm-cosmos/downloads"
max_pages = 300
timeout_seconds = 600
keep_images = false
pdf_max_mb = 60
delete_pdf_after_send = true

[access]
allowed_users = []  # 留空表示所有人可用
allowed_groups = []  # 留空表示所有群可用；私聊不受此限制
admin_bypass = true